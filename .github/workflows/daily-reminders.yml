name: Recordatorios programados

on:
  schedule:
    # Revisión cada 20 minutos, desplazada del inicio de la hora para reducir demoras.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de envío
        required: true
        default: reminders
        type: choice
        options:
          - reminders
          - test-notification

permissions:
  contents: read

concurrency:
  group: scheduled-task-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix functions

      - name: Compilar recordatorios
        run: npm run build --prefix functions

      - name: Enviar recordatorios
        if: github.event_name == 'schedule' || inputs.mode == 'reminders'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node functions/lib/run-reminders.js

      - name: Enviar notificación de prueba
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-notification'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node functions/lib/send-test-notification.js
