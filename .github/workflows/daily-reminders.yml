name: Recordatorios programados

on:
  schedule:
    # Revisión horaria para respetar la anticipación elegida en cada tarea.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-task-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Instalar dependencias
        run: npm ci --prefix functions

      - name: Compilar recordatorios
        run: npm run build --prefix functions

      - name: Enviar recordatorios
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node functions/lib/run-reminders.js
